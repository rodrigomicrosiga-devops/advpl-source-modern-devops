name: Protheus GitOps Gate & Compiler

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop
    paths:
      - 'src/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  # 🛡️ STEP 1: ANÁLISE ESTÁTICA DE CÓDIGO
  code-analysis:
    name: TOTVS Code Analysis (Clean Code Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código do PR
        uses: actions/checkout@v4

      - name: Executar TOTVS Code Analyzer / SonarQube (Ambiente Dev)
        run: |
          echo "🔍 Iniciando varredura simulada com as regras do AppAnalyzer da TOTVS..."
          if grep -ri "select \*" src/; then
            echo "❌ CRITICAL ERROR: Foi detectado um 'SELECT *' sem filtros explícitos!"
            exit 1
          else
            echo "✅ Validação de qualidade concluída com sucesso!"
          fi

  # ⚙️ STEP 2: COMPILAÇÃO ELÁSTICA SÍNCRONA
  compile-rpo:
    name: Native RPO Compilation
    needs: code-analysis
    runs-on: self-hosted
    steps:
      - name: 🔍 Detectar Caminho da Infraestrutura Ativa
        id: infra-detector
        run: |
          echo "=== [GitOps Gate] Mapeando topologia do servidor local ==="
          
          if [ -d "/media/rodrigo/dados/docker-protheus-devops-stack" ]; then
            echo "STK_PATH=/media/rodrigo/dados/docker-protheus-devops-stack" >> $GITHUB_ENV
            echo "SGBD_TYPE=mssql" >> $GITHUB_ENV
            echo "💡 Nova infraestrutura detectada: [docker-protheus-devops-stack] operando em MSSQL."
          elif [ -d "/media/rodrigo/dados/totvs-protheus-modern-devops" ]; then
            echo "STK_PATH=/media/rodrigo/dados/totvs-protheus-modern-devops" >> $GITHUB_ENV
            echo "SGBD_TYPE=postgres" >> $GITHUB_ENV
            echo "💡 Infraestrutura clássica detectada: [totvs-protheus-modern-devops] operando em Postgres."
          else
            echo "❌ ERRO CRÍTICO: Nenhuma raiz de infraestrutura Protheus válida foi localizada no host do Runner!"
            exit 1
          fi

      - name: Limpar Fila de Patches/Staging no Servidor
        run: |
          rm -rf $STK_PATH/protheus/patches/*
          mkdir -p $STK_PATH/protheus/patches

      - name: Checkout dos códigos do PR
        uses: actions/checkout@v4
        with:
          path: 'temp_repo'

      - name: Injetar fontes na Fila de Patches da Infraestrutura
        run: |
          find temp_repo/src/ -type f \( -name "*.prw" -o -name "*.tlpp" \) -exec cp {} $STK_PATH/protheus/patches/ \;
          rm -rf temp_repo

      - name: Disparar Orquestrador de Compilação Protheus
        run: |
          # Navega dinamicamente via Bash e executa o maestro correto
          cd $STK_PATH
          ./run.sh $SGBD_TYPE compile

      # 🔴 FEEDBACK DE FALHA
      - name: Reportar Erro de Compilação no PR
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `### ❌ Falha Crítica na Compilação do RPO!
            O compilador nativo da TOTVS detectou erros de sintaxe nos códigos customizados do seu Pull Request.
            
            ⚠️ **O Rollback automático foi acionado no servidor.** O ambiente permanece íntegro na versão estável anterior.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      # 🟢 FEEDBACK DE SUCESSO
      - name: Reportar Sucesso de Integration no PR
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `### ✅ Compilação Executada com Sucesso!
            Todos os fontes customizados deste PR foram compilados com sucesso ao \`custom.rpo\` no ambiente dev/homolog.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Limpeza de rastro de build
        if: always()
        run: |
          rm -rf $STK_PATH/protheus/patches/*