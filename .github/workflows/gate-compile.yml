name: Protheus GitOps Gate & Compiler

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop # Escutando estritamente a branch develop protegida
    paths:
      - 'src/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  # 🛡️ STEP 1: ANÁLISE ESTÁTICA DE CÓDIGO (MOCK DE HOMOLOGAÇÃO)
  code-analysis:
    name: TOTVS Code Analysis (Clean Code Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código do PR
        uses: actions/checkout@v4

      - name: Executar TOTVS Code Analyzer / SonarQube (Ambiente Dev)
        run: |
          echo "🔍 Iniciando varredura simulada com as regras do AppAnalyzer da TOTVS..."
          echo "📂 Analisando diretório local..."
          
          # Validação simples de segurança via Shell Script para simular o comportamento do gatekeeper
          if grep -ri "select \*" src/; then
            echo "❌ CRITICAL ERROR: Foi detectado um 'SELECT *' sem filtros explícitos!"
            exit 1
          else
            echo "✅ Nenhum padrão destrutivo óbvio foi localizado nos fontes."
            echo "✅ Validação de qualidade concluída com sucesso (Selo Verde provisório)!"
          fi

  # ⚙️ STEP 2: COMPILAÇÃO ELÁSTICA SÍNCRONA
  compile-rpo:
    name: Native RPO Compilation
    needs: code-analysis
    runs-on: self-hosted # <--- Executa o Job no seu robô local Systemd
    steps:
      - name: Limpar Staging Area Anterior no Servidor
        run: |
          rm -rf /tmp/compile_staging
          mkdir -p /tmp/compile_staging

      - name: Checkout dos códigos do PR para o Staging do Servidor
        uses: actions/checkout@v4
        with:
          path: 'temp_repo'

      - name: Injetar fontes na pasta de Staging do Container
        run: |
          cp -r temp_repo/src/* /tmp/compile_staging/
          rm -rf temp_repo

      - name: Disparar Orquestrador de Compilação Protheus
        working-directory: /home/rodrigo/totvs-protheus-modern-devops # <-- Garanta que esse caminho está exato no seu servidor
        run: |
          ./run.sh postgres compile

      # 🔴 FEEDBACK DE FALHA: Executado se a compilação local quebrar
      - name: Reportar Erro de Compilação no PR
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `### ❌ Falha Crítica na Compilação do RPO!
            O compilador nativo da TOTVS detectou erros de sintaxe nos fontes enviados.
            
            ⚠️ **O Rollback automático foi acionado no servidor.** O ambiente permanece estável na versão anterior.
            
            Providencie a correção dos fontes e realize o commit novamente para reiniciar a esteira.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      # 🟢 FEEDBACK DE SUCESSO: Executado se passar tudo de primeira
      - name: Reportar Sucesso de Integration no PR
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `### ✅ Compilação Executada com Sucesso!
            Todos os fontes customizados foram validados sintaticamente e integrados com sucesso ao \`custom.rpo\` no servidor.
            
            🚀 A malha elástica de microsserviços foi reerguida automaticamente. O Pull Request está liberado para revisão e Merge!`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      # 🧼 Limpeza obrigatória do Staging (Sempre executa)
      - name: Limpeza de rastro de build
        if: always()
        run: |
          rm -rf /tmp/compile_staging