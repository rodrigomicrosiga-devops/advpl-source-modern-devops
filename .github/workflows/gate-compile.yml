name: Protheus GitOps Gate & Compiler

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop
    paths:
      - 'src/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  # 🛡️ STEP 1: ANÁLISE ESTÁTICA DE CÓDIGO
  code-analysis:
    name: TOTVS Code Analysis (Clean Code Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código do PR
        uses: actions/checkout@v4

      - name: Executar TOTVS Code Analyzer / SonarQube (Ambiente Dev)
        run: |
          echo "🔍 Iniciando varredura simulada com as regras do AppAnalyzer da TOTVS..."
          if grep -ri "select \*" src/; then
            echo "❌ CRITICAL ERROR: Foi detectado um 'SELECT *' sem filtros explícitos!"
            exit 1
          else
            echo "✅ Validação de qualidade concluída com sucesso!"
          fi

  # ⚙️ STEP 2: COMPILAÇÃO ELÁSTICA SÍNCRONA
  compile-rpo:
    name: Native RPO Compilation
    needs: code-analysis
    runs-on: self-hosted
    steps:
      - name: Limpar Fila de Patches/Staging no Servidor
        # CORRIGIDO: Limpando a pasta real de patches no seu ponto de montagem /media
        run: |
          rm -rf /media/rodrigo/dados/totvs-protheus-modern-devops/protheus/patches/*
          mkdir -p /media/rodrigo/dados/totvs-protheus-modern-devops/protheus/patches

      - name: Checkout dos códigos do PR
        uses: actions/checkout@v4
        with:
          path: 'temp_repo'

      - name: Injetar fontes na Fila de Patches da Infraestrutura
        run: |
          # Procura todos os arquivos dentro de temp_repo/src/ e copia direto para a raiz de patches, sem levar as subpastas
          find temp_repo/src/ -type f \( -name "*.prw" -o -name "*.tlpp" \) -exec cp {} /media/rodrigo/dados/totvs-protheus-modern-devops/protheus/patches/ \;
          rm -rf temp_repo

      - name: Disparar Orquestrador de Compilação Protheus
        # CORRIGIDO: Direcionando o contexto do Runner para a pasta real do projeto
        working-directory: /media/rodrigo/dados/totvs-protheus-modern-devops
        run: |
          # Executa chamando o script pelo caminho absoluto verdadeiro do seu HD/Partição
          /media/rodrigo/dados/totvs-protheus-modern-devops/run.sh postgres compile

      # 🔴 FEEDBACK DE FALHA
      - name: Reportar Erro de Compilação no PR
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `### ❌ Falha Crítica na Compilação do RPO!
            O compilador nativo da TOTVS detectou erros de sintaxe nos códigos customizados.
            
            ⚠️ **O Rollback automático foi acionado no servidor.** O ambiente permanece estável na versão anterior.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      # 🟢 FEEDBACK DE SUCESSO
      - name: Reportar Sucesso de Integration no PR
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `### ✅ Compilação Executada com Sucesso!
            Todos os fontes customizados foram validados sintaticamente e integrados com sucesso ao \`custom.rpo\` no servidor.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Limpeza de rastro de build
        if: always()
        # CORRIGIDO: Limpando a pasta de patches correta após o término
        run: |
          rm -rf /media/rodrigo/dados/totvs-protheus-modern-devops/protheus/patches/*