# ==============================================================================
# TOTVS AppAnalyzer / SonarQube - ADVPL & TLPP Governance Architecture
# Repository: advpl-source-modern-devops
# Owner: Rodrigo dos Santos Brandão
# ==============================================================================

# 1. Identificação Única do Projeto no Ecossistema DevOps
sonar.projectKey=advpl-source-modern-devops
sonar.projectName=ADVPL and TLPP Source - Modern DevOps Core
sonar.projectVersion=1.0.0

# 2. Mapeamento de Escopo (O que deve e o que NÃO deve ser analisado)
# Aponta estritamente para a pasta src para evitar varrer arquivos de configuração do pipeline
sonar.sources=src
sonar.sourceEncoding=UTF-8

# 3. Dialeto de Linguagem Oficial TOTVS
# Instrui a engine do Sonar a interpretar as particularidades sintáticas do ecossistema Protheus
sonar.language=advpl
sonar.advpl.workspace=src

# 4. Configuração das Regras Estritas de Quality Gate (Exemplos de Bloqueio Ativo)
# - Impedir queries preigosas (ex: SELECT sem WHERE nos campos de índice)
# - Validar loops infinitos (ausência de incrementos ou checagem de EOF)
# - Impedir o uso de funções obsoletas descontinuadas pela TOTVS
sonar.advpl.appanalyzer.active=true

# 5. Otimização de Performance de Varredura
# Ignora arquivos temporários locais, backups ou logs que porventura burlem o .gitignore
sonar.exclusions=**/*.log, **/*.err, **/*.bak, **/tmp/**